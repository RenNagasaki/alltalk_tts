# Datenschutz-Gate vor dem GitHub-Mirror (Vorlage und Einrichtung: private/claude
# › tools/ci/privacy-gate.gitlab-ci.yml).
include:
  - project: private/claude
    file: tools/ci/privacy-gate.gitlab-ci.yml

stages:
  - build
  - privacy
  - mirror

variables:
  TTS_MODEL: "xtts"
  DOCKER_TAG: "latest"
  BASE_IMAGE_REPO: "erew123/"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_CERT_PATH: "/certs/client"
  DOCKER_TLS_VERIFY: "1"

build-alltalk:
  stage: build
  # The image build is independent of the mirror: a stuck or failed build (no runner, 3h timeout)
  # must not skip the privacy gate and the GitHub mirror in the later stages.
  allow_failure: true
  timeout: 3h
  image: docker:27
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker info
    - docker build --pull
      --build-arg TTS_MODEL=$TTS_MODEL
      --build-arg DEEPSPEED_VERSION=0.17.2
      --build-arg DOCKER_TAG=$DOCKER_TAG
      --build-arg DOCKER_REPOSITORY=$BASE_IMAGE_REPO
      -t $CI_REGISTRY_IMAGE:latest-$TTS_MODEL
      .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest-$TTS_MODEL
      || (docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
      && docker push $CI_REGISTRY_IMAGE:latest-$TTS_MODEL)
  tags:
    - docker

# Datenschutz-Gate: laeuft genau dann, wenn gespiegelt wird (rules wie mirror-to-github),
# und bricht den Mirror bei einem Verweis auf Person/Infrastruktur ab.
privacy-gate:
  rules:
    - if: $CI_COMMIT_BRANCH

mirror-to-github:
  stage: mirror
  image: alpine/git:latest
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - git clone --mirror "$CI_REPOSITORY_URL" repo.git
    - cd repo.git
    - git remote add github "https://${GITHUB_USER}:${GITHUB_PAT}@github.com/${GITHUB_USER}/alltalk_tts.git"
    - git push github --mirror --force
